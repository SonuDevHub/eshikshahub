<script type="text/x-dc" data-dc-script data-props='{"tone":{"editor":"enum","options":["scrolled","hero"],"default":"scrolled"},"open":{"editor":"boolean","default":false},"active":{"editor":"enum","options":["none","courses","about","placement","refer","contact"],"default":"none"},"$preview":{"width":1440,"height":88}}'>
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active ?? 'none';
    const open = this.props.open === true || this.props.open === 'yes';
    const on = (k) => (a === k || (k === 'courses' && open) ? 'on' : '');
    return {
      markColor: this.props.tone === 'hero' ? '#F4F3EF' : '#181D38',
      open: open,
      expanded: open ? 'true' : 'false',
      chev: open ? 'rotate(180deg)' : 'none',
      cCourses: on('courses'), cAbout: on('about'), cPlacement: on('placement'), cRefer: on('refer'), cContact: on('contact')
    };
  }
}
</script>
